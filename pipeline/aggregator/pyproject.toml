[project]
name = "aggregator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "gtfs-realtime-bindings>=1.0",
    "duckdb>=1.1",
]

[project.scripts]
aggregator = "aggregator.main:main"
maak-segmenten = "aggregator.maak_segmenten:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aggregator"]
